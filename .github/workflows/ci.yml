name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@localhost:5432/postgres' || '' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then unset DATABASE_URL; fi
          pytest -q

  retrieval-benchmark:
    name: Retrieval benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements.txt
      - name: Run benchmark (fails if below eval/thresholds.json)
        run: python -m scripts.eval_retrieval --configs 800:150,500:100,120:0 --check --json eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-report
          path: backend/eval-report.json

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.com
